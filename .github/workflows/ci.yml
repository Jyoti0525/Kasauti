# Kasauti CI (PLAN §23, docs/TODO.md M0.05–M0.08).
# Every third-party action is pinned to a full commit SHA and every container to a digest,
# so a moved tag can't change what runs here (PLAN §17, supply chain).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"          # install exactly what uv.lock says; fail if it's out of date
  PYTHONUTF8: "1"

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (strict)
        run: uv run mypy
      - name: Tests (network disabled for the core, TODO S.11)
        run: uv run pytest -p no:cacheprovider

  postgresql:
    name: database · PostgreSQL
    # SQLite is covered by every other job; this runs the schema tests on a real PostgreSQL
    # (PLAN §4.2), the same major version as the one we test against locally.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: kasauti
          POSTGRES_DB: kasauti_test
          # Throwaway server, reachable only from this job's runner; no password to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kasauti" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --extra postgresql
      - name: Migrations on PostgreSQL
        env:
          KASAUTI_TEST_POSTGRES_URL: postgresql://kasauti@127.0.0.1:5432/kasauti_test
        run: uv run pytest backend/tests/db -p no:cacheprovider -rs

  content-gates:
    name: content gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Pack schemas and cross-file checks
        run: uv run kasauti packs validate packs
      - name: Rule quality gate + crosswalk lint (PLAN §12.2, §12.4)
        run: uv run python tools/lint_content.py
      - name: Golden regression (PLAN §21.1 E1)
        run: uv run pytest -m golden -p no:cacheprovider
      - name: JSON Schemas match the code
        run: uv run python tools/export_schemas.py --check

  supply-chain:
    name: licences · vulnerabilities · secrets · SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks scans the full history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Licence gate (PLAN §19.5)
        run: uv run python tools/check_licences.py
      - name: Known vulnerabilities in every locked dependency (runtime + dev)
        run: |
          uv export --all-groups --no-emit-project --format requirements-txt -o locked.txt
          uv run pip-audit -r locked.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Static security analysis
        run: uv run bandit -c pyproject.toml -r backend/kasauti tools eval/harness -q
      # Reviewed false positives are listed one by one, by fingerprint, in .gitleaksignore.
      # --verbose prints where each finding is (the value itself stays redacted).
      - name: Secrets in history
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
          --redact --verbose --no-banner --no-color
      - name: Filesystem scan (vulnerabilities, misconfiguration, secrets)
        run: >
          docker run --rm -v "$PWD:/src"
          ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --exit-code 1 --severity HIGH,CRITICAL --skip-dirs /src/.venv /src
      - name: CycloneDX SBOM
        run: uv run cyclonedx-py environment --of JSON -o sbom.cdx.json .venv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
