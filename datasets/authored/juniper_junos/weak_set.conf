# Kasauti authored corpus: Junos OS 23.4, weak twin, as `show configuration | display set`
# prints it: weak.conf, one set command per statement. All secrets are placeholders.
set version 23.4R1.9
set system host-name BR-SRX1
set system root-authentication encrypted-password "$1$PLACEHOLDER$PLACEHOLDERHASH"
set system login password minimum-length 6
set system login user netadmin class super-user
set system login user netadmin authentication encrypted-password "$6$PLACEHOLDER$PLACEHOLDERHASH"
set system services ssh
set system services telnet
set system services finger
set system services web-management http interface ge-0/0/0.0
set system syslog file messages any notice
set system ntp server 10.20.10.70
set interfaces ge-0/0/0 unit 0 description "WAN uplink"
set interfaces ge-0/0/0 unit 0 family inet proxy-arp unrestricted
set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.2/30
set interfaces ge-0/0/1 unit 0 description "LAN"
set interfaces ge-0/0/1 unit 0 family inet address 10.20.20.1/24
set interfaces lo0 unit 0 family inet filter input PROTECT-RE
set interfaces lo0 unit 0 family inet address 10.20.255.1/32
set routing-options static route 0.0.0.0/0 next-hop 198.51.100.1
set snmp community public authorization read-write
set firewall family inet filter ALLOW-ALL term ANY then accept
set security zones security-zone trust interfaces ge-0/0/1.0
