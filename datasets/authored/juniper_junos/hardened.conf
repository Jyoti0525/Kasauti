/* Kasauti authored corpus: Junos OS 23.4, hardened branch SRX.
   Written from Juniper Junos OS documentation. All secrets are placeholders. */
version 23.4R1.9;
system {
    host-name BR-SRX1;
    root-authentication {
        encrypted-password "$6$PLACEHOLDER$PLACEHOLDERHASH";
    }
    login {
        class NETADMIN {
            idle-timeout 10;
            permissions all;
        }
        retry-options {
            tries-before-disconnect 3;
            lockout-period 10;
        }
        password {
            minimum-length 15;
            change-type character-sets;
            minimum-character-changes 4;
        }
        user netadmin {
            class NETADMIN;
            authentication {
                encrypted-password "$6$PLACEHOLDER$PLACEHOLDERHASH";
            }
        }
        message "Authorised access only. Activity is logged and monitored.";
    }
    authentication-order [ tacplus password ];
    tacplus-server {
        10.20.10.40 secret "$9$PLACEHOLDER";
    }
    services {
        ssh {
            root-login deny;
            protocol-version v2;
            connection-limit 10;
            rate-limit 5;
        }
        netconf {
            ssh;
        }
    }
    syslog {
        host 10.20.10.50 {
            any notice;
            authorization info;
            interactive-commands any;
        }
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
        time-format millisecond;
    }
    ntp {
        authentication-key 1 type sha256 value "$9$PLACEHOLDER";
        server 10.20.10.70 key 1;
        trusted-key 1;
    }
}
interfaces {
    ge-0/0/0 {
        description "WAN uplink";
        unit 0 {
            family inet {
                address 198.51.100.2/30;
            }
        }
    }
    ge-0/0/1 {
        description "LAN";
        unit 0 {
            family inet {
                address 10.20.20.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input PROTECT-RE;
                }
                address 10.20.255.1/32;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 198.51.100.1;
    }
}
snmp {
    v3 {
        usm {
            local-engine {
                user nmsuser {
                    authentication-sha {
                        authentication-key "$9$PLACEHOLDER";
                    }
                    privacy-aes128 {
                        privacy-key "$9$PLACEHOLDER";
                    }
                }
            }
        }
    }
}
firewall {
    family inet {
        filter PROTECT-RE {
            term ALLOW-SSH-MGMT {
                from {
                    source-address {
                        10.20.10.0/24;
                    }
                    protocol tcp;
                    destination-port ssh;
                }
                then accept;
            }
            term ALLOW-NTP {
                from {
                    source-address {
                        10.20.10.70/32;
                    }
                    protocol udp;
                    port ntp;
                }
                then accept;
            }
            term DENY-REST {
                then {
                    syslog;
                    discard;
                }
            }
        }
    }
}
security {
    zones {
        security-zone untrust {
            interfaces {
                ge-0/0/0.0;
            }
        }
        security-zone trust {
            interfaces {
                ge-0/0/1.0 {
                    host-inbound-traffic {
                        system-services {
                            ssh;
                        }
                    }
                }
            }
        }
    }
}
