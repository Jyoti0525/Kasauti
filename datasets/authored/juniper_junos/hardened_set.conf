# Kasauti authored corpus: Junos OS 23.4, hardened branch SRX, as `show configuration | display set`
# prints it: hardened.conf, one set command per statement. All secrets are placeholders.
set version 23.4R1.9
set system host-name BR-SRX1
set system root-authentication encrypted-password "$6$PLACEHOLDER$PLACEHOLDERHASH"
set system login class NETADMIN idle-timeout 10
set system login class NETADMIN permissions all
set system login retry-options tries-before-disconnect 3
set system login retry-options lockout-period 10
set system login password minimum-length 15
set system login password change-type character-sets
set system login password minimum-character-changes 4
set system login user netadmin class NETADMIN
set system login user netadmin authentication encrypted-password "$6$PLACEHOLDER$PLACEHOLDERHASH"
set system login message "Authorised access only. Activity is logged and monitored."
set system authentication-order tacplus
set system authentication-order password
set system tacplus-server 10.20.10.40 secret "$9$PLACEHOLDER"
set system services ssh root-login deny
set system services ssh protocol-version v2
set system services ssh connection-limit 10
set system services ssh rate-limit 5
set system services netconf ssh
set system syslog host 10.20.10.50 any notice
set system syslog host 10.20.10.50 authorization info
set system syslog host 10.20.10.50 interactive-commands any
set system syslog file interactive-commands interactive-commands any
set system syslog file messages any notice
set system syslog file messages authorization info
set system syslog time-format millisecond
set system ntp authentication-key 1 type sha256 value "$9$PLACEHOLDER"
set system ntp server 10.20.10.70 key 1
set system ntp trusted-key 1
set interfaces ge-0/0/0 description "WAN uplink"
set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.2/30
set interfaces ge-0/0/1 description "LAN"
set interfaces ge-0/0/1 unit 0 family inet address 10.20.20.1/24
set interfaces lo0 unit 0 family inet filter input PROTECT-RE
set interfaces lo0 unit 0 family inet address 10.20.255.1/32
set routing-options static route 0.0.0.0/0 next-hop 198.51.100.1
set snmp v3 usm local-engine user nmsuser authentication-sha authentication-key "$9$PLACEHOLDER"
set snmp v3 usm local-engine user nmsuser privacy-aes128 privacy-key "$9$PLACEHOLDER"
set firewall family inet filter PROTECT-RE term ALLOW-SSH-MGMT from source-address 10.20.10.0/24
set firewall family inet filter PROTECT-RE term ALLOW-SSH-MGMT from protocol tcp
set firewall family inet filter PROTECT-RE term ALLOW-SSH-MGMT from destination-port ssh
set firewall family inet filter PROTECT-RE term ALLOW-SSH-MGMT then accept
set firewall family inet filter PROTECT-RE term ALLOW-NTP from source-address 10.20.10.70/32
set firewall family inet filter PROTECT-RE term ALLOW-NTP from protocol udp
set firewall family inet filter PROTECT-RE term ALLOW-NTP from port ntp
set firewall family inet filter PROTECT-RE term ALLOW-NTP then accept
set firewall family inet filter PROTECT-RE term DENY-REST then syslog
set firewall family inet filter PROTECT-RE term DENY-REST then discard
set security zones security-zone untrust interfaces ge-0/0/0.0
set security zones security-zone trust interfaces ge-0/0/1.0 host-inbound-traffic system-services ssh
