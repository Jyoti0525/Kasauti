/* Kasauti authored corpus: Junos OS 23.4, weak twin of hardened.conf.
   Every weakness is deliberate and catalogued in datasets/SOURCES.md. All secrets are placeholders. */
version 23.4R1.9;
system {
    host-name BR-SRX1;
    root-authentication {
        encrypted-password "$1$PLACEHOLDER$PLACEHOLDERHASH";
    }
    login {
        password {
            minimum-length 6;
        }
        user netadmin {
            class super-user;
            authentication {
                encrypted-password "$6$PLACEHOLDER$PLACEHOLDERHASH";
            }
        }
    }
    services {
        ssh;
        telnet;
        finger;
        web-management {
            http {
                interface ge-0/0/0.0;
            }
        }
    }
    syslog {
        file messages {
            any notice;
        }
    }
    ntp {
        server 10.20.10.70;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            description "WAN uplink";
            family inet {
                proxy-arp unrestricted;
                address 198.51.100.2/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            description "LAN";
            family inet {
                address 10.20.20.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input PROTECT-RE;
                }
                address 10.20.255.1/32;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 198.51.100.1;
    }
}
snmp {
    community public {
        authorization read-write;
    }
}
firewall {
    family inet {
        filter ALLOW-ALL {
            term ANY {
                then accept;
            }
        }
    }
}
security {
    zones {
        security-zone trust {
            interfaces {
                ge-0/0/1.0;
            }
        }
    }
}
