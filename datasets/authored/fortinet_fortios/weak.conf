#config-version=FGT60F-7.4.8-FW-build2795-250523:opmode=0:vdom=0:user=admin
#conf_file_ver=1027384956
#buildno=2795
#global_vdom=1
config system global
    set admin-https-redirect disable
    set admin-lockout-threshold 10
    set admin-ssh-v1 enable
    set admintimeout 480
    set alias "FGT-BRANCH"
    set hostname "FGT-BRANCH"
    set timezone "Asia/Kolkata"
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.6 255.255.255.252
        set allowaccess ping https ssh http telnet
        set type physical
        set role wan
        set alias "WAN uplink to ISP"
    next
    edit "internal"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping https ssh
        set type hard-switch
        set role lan
    next
end
config system proxy-arp
    edit 1
        set interface "wan1"
        set ip 198.51.100.8
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2PLACEHOLDERHASH
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config log syslogd setting
    set server "10.30.10.50"
end
config log eventfilter
    set system disable
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "10.30.10.70"
        next
    end
end
config firewall address
    edit "all"
    next
    edit "ANY-NET"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config firewall policy
    edit 1
        set name "wan-in"
        set srcintf "wan1"
        set dstintf "internal"
        set action accept
        set srcaddr "all"
        set dstaddr "ANY-NET"
        set schedule "always"
        set service "ALL"
    next
end
config router static
    edit 1
        set gateway 198.51.100.5
        set device "wan1"
    next
end
