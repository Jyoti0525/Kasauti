#config-version=FGT60F-7.4.8-FW-build2795-250523:opmode=0:vdom=0:user=netadmin
#conf_file_ver=1027384956
#buildno=2795
#global_vdom=1
#Kasauti authored fixture: FortiOS 7.4.8, no trusted hosts; HTTPS and SSH on the WAN port are
#limited to the NOC network by local-in policies (accept NOC-NET, then deny everyone).
#Pass fixture for MGMT-WEB-ACL-01. All secrets are placeholders.
config system global
    set admintimeout 10
    set hostname "FGT-LOCALIN"
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping https ssh
        set type physical
        set role wan
        set alias "WAN uplink, managed from the NOC over the Internet"
    next
end
config system admin
    edit "netadmin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC PB2PLACEHOLDERHASH
    next
end
config firewall address
    edit "all"
    next
    edit "NOC-NET"
        set subnet 203.0.113.0 255.255.255.0
    next
end
config firewall service custom
    edit "ALL"
        set category "General"
        set protocol IP
    next
    edit "HTTPS"
        set category "Web Access"
        set tcp-portrange 443
    next
    edit "SSH"
        set category "Remote Access"
        set tcp-portrange 22
    next
end
config firewall local-in-policy
    edit 1
        set uuid 3f6b1c2e-0000-4000-8000-000000000001
        set intf "wan1"
        set srcaddr "NOC-NET"
        set dstaddr "all"
        set action accept
        set service "HTTPS" "SSH"
        set schedule "always"
    next
    edit 2
        set uuid 3f6b1c2e-0000-4000-8000-000000000002
        set intf "any"
        set srcaddr "all"
        set dstaddr "all"
        set service "HTTPS" "SSH"
        set schedule "always"
        set comments "implicit deny, placed last as Fortinet advises"
    next
end
