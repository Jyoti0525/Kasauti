#config-version=FGT60F-7.4.8-FW-build2795-250523:opmode=0:vdom=0:user=netadmin
#conf_file_ver=1027384957
#buildno=2795
#global_vdom=1
#Kasauti authored fixture: FortiOS 7.4.8, a firewall policy whose source names the address
#group "LAN_GRP", which the file doesn't define: what the policy lets through can't be known.
#Fail fixture for REF-DANGLING-01.
config system global
    set admintimeout 10
    set hostname "FGT-REFS"
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role lan
    next
end
config firewall address
    edit "all"
    next
    edit "LAN-NET"
        set subnet 10.20.0.0 255.255.255.0
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall policy
    edit 1
        set name "lan-to-internet"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "LAN_GRP"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set nat enable
    next
end
