!
! Kasauti authored corpus: Cisco IOS-XE 17.9, hardened edge router.
! Written from Cisco IOS XE 17 configuration guides. All secrets are placeholders.
!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
no service tcp-small-servers
no service udp-small-servers
!
hostname EDGE-R1
!
boot-start-marker
boot-end-marker
!
security passwords min-length 15
enable secret 9 $9$PLACEHOLDERsalt$PLACEHOLDERhashPLACEHOLDERhash
!
aaa new-model
aaa authentication login default group TACACS-GRP local
aaa authorization exec default group TACACS-GRP local
aaa accounting exec default start-stop group TACACS-GRP
aaa accounting commands 15 default start-stop group TACACS-GRP
!
username netadmin privilege 15 secret 9 $9$PLACEHOLDERsalt$PLACEHOLDERhashPLACEHOLDERhash
!
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
!
ip domain name example.net
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256
!
no ip http server
no ip http secure-server
no ip source-route
no ip finger
no ip bootp server
!
archive
 log config
  logging enable
  notify syslog contenttype plaintext
  hidekeys
!
interface GigabitEthernet1
 description WAN uplink
 ip address 203.0.113.2 255.255.255.252
 ip access-group EDGE-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no cdp enable
!
interface GigabitEthernet2
 description LAN
 ip address 10.10.20.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
!
interface GigabitEthernet3
 description Out-of-band management
 ip address 10.10.10.1 255.255.255.0
 no ip proxy-arp
!
ip access-list standard MGMT-ACL
 10 permit 10.10.10.0 0.0.0.255
 20 deny any log
!
ip access-list extended EDGE-IN
 10 deny tcp any any eq telnet log
 20 deny udp any any eq snmp log
 30 permit tcp any host 203.0.113.2 eq 22 log
 40 permit icmp any any echo-reply
 50 deny ip any any log
!
tacacs server TAC1
 address ipv4 10.10.10.40
 key 7 PLACEHOLDERKEY
!
aaa group server tacacs+ TACACS-GRP
 server name TAC1
!
logging buffered 64000 informational
logging trap informational
logging source-interface GigabitEthernet3
logging host 10.10.10.50 transport tcp port 601
!
snmp-server group NMS-GRP v3 priv read NMS-VIEW access MGMT-ACL
snmp-server view NMS-VIEW iso included
snmp-server host 10.10.10.60 version 3 priv nmsuser
!
ntp authentication-key 1 hmac-sha2-256 PLACEHOLDERKEY
ntp authenticate
ntp trusted-key 1
ntp server 10.10.10.70 key 1
!
banner login ^C
Authorised access only. Activity is logged and monitored.
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 access-class MGMT-ACL in
 exec-timeout 10 0
 transport input ssh
 transport output none
line vty 5 15
 access-class MGMT-ACL in
 exec-timeout 10 0
 transport input none
!
end
