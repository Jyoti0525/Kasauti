! Command: show running-config
! device: LEAF-2 (DCS-7050SX3-48YC8, EOS-4.30.1F)
!
! Authored for Kasauti (SIH 26155). Deliberately weak configuration: each planted weakness
! is catalogued as E1..En in datasets/SOURCES.md. Secrets are placeholders.
!
username admin privilege 15 role network-admin nopassword
username netadmin privilege 15 role network-admin secret 5 $1$PLACEHOLDER$PLACEHOLDERHASH
!
hostname LEAF-2
!
logging format timestamp traditional
!
ntp server 10.30.10.70 iburst
!
snmp-server community public ro
snmp-server community private rw
!
spanning-tree mode mstp
!
interface Ethernet1
   description WAN uplink to ISP
   no switchport
   ip address 198.51.100.6/30
   ip proxy-arp
!
interface Ethernet2
   description LAN server segment
   no switchport
   ip address 10.20.0.1/24
!
interface Management1
   description OOB management
   ip address 10.30.10.3/24
!
ip access-list EDGE-IN
   10 permit ip any any
!
management api http-commands
   protocol http
   no shutdown
!
management console
   idle-timeout 0
!
management ssh
   ip access-group MGMT-ACL in
   idle-timeout 0
!
management telnet
   no shutdown
!
end
