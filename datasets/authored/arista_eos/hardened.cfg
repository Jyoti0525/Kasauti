! Command: show running-config
! device: LEAF-1 (DCS-7050SX3-48YC8, EOS-4.30.1F)
!
! Authored for Kasauti (SIH 26155). Hardened reference configuration: every secret is a
! placeholder, every address is from a documentation or private range.
!
no aaa root
aaa authentication policy lockout failure 3 duration 900
!
username netadmin privilege 15 role network-admin secret sha512 $6$PLACEHOLDER$PLACEHOLDERHASH
!
management security
   password minimum length 15
!
hostname LEAF-1
!
tacacs-server host 10.30.10.40 key 7 PLACEHOLDERKEY
!
aaa group server tacacs+ TACACS-GROUP
   server 10.30.10.40
!
aaa authentication login default group TACACS-GROUP local
aaa authorization exec default group TACACS-GROUP local
aaa accounting commands all default start-stop group TACACS-GROUP logging
!
logging host 10.30.10.50 514 protocol tcp
logging format timestamp high-resolution
!
ntp authentication-key 1 sha1 7 PLACEHOLDERNTPKEY
ntp trusted-key 1
ntp authenticate
ntp server 10.30.10.70 iburst key 1
!
spanning-tree mode mstp
!
interface Ethernet1
   description WAN uplink to ISP
   no switchport
   ip address 198.51.100.2/30
   ip access-group EDGE-IN in
!
interface Ethernet2
   description LAN server segment
   no switchport
   ip address 10.20.0.1/24
!
interface Management1
   description OOB management
   ip address 10.30.10.2/24
!
ip access-list EDGE-IN
   10 permit tcp any host 198.51.100.2 eq ssh
   20 deny ip any any log
!
ip access-list standard MGMT-ACL
   10 permit 10.30.10.0/24
   20 deny any log
!
management console
   idle-timeout 5
!
management ssh
   ip access-group MGMT-ACL in
   idle-timeout 10
!
banner login
Authorised access only. Activity on this device is logged and monitored.
EOF
!
end
