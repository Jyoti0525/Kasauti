[project]
name = "kasauti"
version = "0.1.0"
description = "Kasauti (कसौटी): AI-driven multi-vendor network security compliance auditor"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
# Every dependency's licence is verified at the source before it is added (docs/TODO.md S.03)
# and checked again in CI by tools/check_licences.py.
dependencies = [
    "pydantic>=2.13,<3",            # MIT
    "pyyaml>=6.0.3,<7",             # MIT
    "structlog>=26.1,<27",          # MIT OR Apache-2.0
    "charset-normalizer>=3.5,<4",   # MIT (encoding detection; not chardet, which is LGPL)
    "defusedxml>=0.7.1,<0.8",       # PSF-2.0 (XXE / billion-laughs safe XML parsing)
    "google-re2>=1.1,<2",           # BSD-3-Clause (linear-time regex for untrusted input)
    "reportlab>=5.0,<6",            # BSD-3-Clause (+ Pillow MIT-CMU) for PDF reports
    "fastapi>=0.141,<1",            # MIT (+ starlette BSD-3, anyio MIT, annotated-doc MIT)
    "uvicorn>=0.54,<1",             # BSD-3-Clause (+ click BSD-3, h11 MIT); plain, no [standard]
    "python-multipart>=0.0.32,<0.1", # Apache-2.0 (form and file uploads)
    "sqlalchemy>=2.1.1,<2.2",       # MIT (+ typing-extensions PSF-2.0); sync API, no greenlet
    "alembic>=1.20,<2",             # MIT (+ Mako MIT, MarkupSafe BSD-3); schema migrations
    "cryptography>=50.0.1,<51",     # Apache-2.0 OR BSD-3-Clause (+ cffi MIT-0, pycparser BSD-3)
    "argon2-cffi>=25.1,<26",        # MIT (+ argon2-cffi-bindings MIT); Argon2id password hashes
]

[project.scripts]
kasauti = "kasauti.cli.main:main"

[project.optional-dependencies]
# PostgreSQL for multi-user servers (PLAN §4.2); SQLite needs nothing. `uv sync --extra postgresql`
postgresql = [
    "psycopg[binary]>=3.3.6,<4",    # LGPL-3.0-only, used unmodified as a library (PLAN §19.1)
]

[dependency-groups]
dev = [
    "pytest>=9.1",            # MIT
    "hypothesis>=6.168",      # MPL-2.0 (dev only, unmodified)
    "ruff>=0.16",             # MIT
    "mypy>=2.3",              # MIT
    "types-PyYAML>=6.0.12",   # Apache-2.0
    "types-reportlab>=5.0",   # Apache-2.0 (typeshed)
    "types-defusedxml>=0.7",  # Apache-2.0 (typeshed)
    "pre-commit>=4.6",        # MIT
    "pip-audit>=2.10",        # Apache-2.0
    "bandit>=1.9",            # Apache-2.0
    "cyclonedx-bom>=7.4",     # Apache-2.0
    # BSD-3-Clause (FastAPI test client; certifi MPL-2.0, dev only)
    "httpx2>=2.13,<3",        # BSD-3-Clause (the ASGI test client; truststore MIT)
]

[build-system]
requires = ["hatchling>=1.32"]  # MIT
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/kasauti"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "eval", "tools"]
extend-exclude = ["frontend", "datasets", "docs/archive", ".playwright-mcp"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "PL", "PTH", "TRY", "ERA"]
ignore = [
    "PLR2004",  # magic values are fine in a rule engine's tests
    "TRY003",   # descriptive exception messages are wanted
    "PLR0913",
    "PLR0911",  # a recursive-descent parser naturally returns from many branches
]

# The docs use proper typography (en dashes in ranges such as E1–E5, M1–M3).
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "PLR2004", "S603"]
"eval/tests/**" = ["S101"]
"tools/**" = ["T201"]
"tools/tests/**" = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["backend", "eval", "tools"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["backend/kasauti", "eval/harness", "tools", "deploy"]

[[tool.mypy.overrides]]
module = ["re2"]            # google-re2 ships no type information; wrapped in kasauti.rules.regex
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "eval/tests", "tools/tests"]
pythonpath = ["backend", "eval", "tools"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = [
    "golden: golden regression tests (PLAN §21.1 E1)",
    "spec: executable spec tests that turn green as milestones land",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
