# Alembic, for developers adding a migration (TODO M2.02):
#   uv run alembic revision --autogenerate --rev-id 0002 -m "job table"
# The database comes from KASAUTI_DATABASE_URL, else ./var/kasauti.db, set up exactly as the
# application sets it up (kasauti/db/engine.py). Users run `kasauti db upgrade`, not this.
[alembic]
script_location = %(here)s/backend/kasauti/db/migrations
prepend_sys_path = backend
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
