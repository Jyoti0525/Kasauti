# Rules -> DISA STIG rules, per vendor benchmark (PLAN §12.4; TODO M2.56).
#
# Each entry was matched by reading the STIG rule's title, check and fix text against the rule's
# assertion. `covers` says how far the rule decides the STIG rule; `note` says what it leaves out.
# The crosswalk lint checks every STIG rule shares a NIST SP 800-53 base control with the rule
# (through its CCIs); `bridge_note` explains the few that DISA files under an unrelated control.
format_version: 1
framework: disa_stig
entries:
  # --- Cisco IOS XE Router NDM V3R7 + RTR V3R5 ------------------------------------------------
  - {rule: AAA-CENTRAL-AUTH-01, vendor: cisco_ios_xe, controls: [CISC-ND-001370], source: authored, covers: part,
     note: "The STIG asks for at least two authentication servers; the rule checks that one is in use.",
     bridge_note: "DISA files this under CM-6(1) through its CCI; the requirement itself is central authentication of administrators (AC-2(1), IA-2)."}
  - {rule: AAA-LOCKOUT-01, vendor: cisco_ios_xe, controls: [CISC-ND-000150], source: authored, covers: part,
     note: "The STIG asks for three attempts and a 15-minute lockout; the rule accepts up to five attempts."}
  - {rule: AAA-PASSWORD-ENCRYPTION-01, vendor: cisco_ios_xe, controls: [CISC-ND-000620], source: authored}
  - {rule: AAA-PASSWORD-MIN-LENGTH-01, vendor: cisco_ios_xe, controls: [CISC-ND-000550], source: authored}
  - {rule: FILTER-UNTRUSTED-INGRESS-01, vendor: cisco_ios_xe, controls: [CISC-RT-000330], source: authored, covers: part,
     note: "Checks that each interface Kasauti finds untrusted filters inbound traffic, not what the filter allows."}
  - {rule: LOG-CONFIG-CHANGE-01, vendor: cisco_ios_xe, controls: [CISC-ND-001270], source: authored}
  - {rule: LOG-CONFIG-CHANGE-01, vendor: cisco_ios_xe, controls: [CISC-ND-000210], source: authored, covers: part,
     note: "The STIG also asks for `logging userinfo`; the rule checks configuration-change logging."}
  - {rule: LOG-REMOTE-01, vendor: cisco_ios_xe, controls: [CISC-ND-001450], source: authored, covers: part,
     note: "The STIG asks for at least two syslog servers; the rule checks for one."}
  - {rule: LOG-TIMESTAMPS-01, vendor: cisco_ios_xe, controls: [CISC-ND-000280], source: authored}
  - {rule: MGMT-BANNER-01, vendor: cisco_ios_xe, controls: [CISC-ND-000160], source: authored, covers: part,
     note: "The STIG asks for the DoD Notice and Consent text; the rule checks a banner is shown."}
  - {rule: MGMT-HTTP-01, vendor: cisco_ios_xe, controls: [CISC-ND-000470], source: authored, covers: part,
     note: "One of the insecure services the STIG rule covers."}
  - {rule: MGMT-SESSION-TIMEOUT-01, vendor: cisco_ios_xe, controls: [CISC-ND-000720], source: authored, covers: part,
     note: "The STIG asks for 5 minutes; the rule accepts up to 10."}
  - {rule: MGMT-SSH-V2-01, vendor: cisco_ios_xe, controls: [CISC-ND-001210], source: authored, covers: part,
     note: "SSH v1 fails the STIG's approved-cipher requirement; the ciphers themselves aren't checked.",
     bridge_note: "DISA files remote-management encryption under MA-4(6) (nonlocal maintenance); the rule anchors the same protection as AC-17(2)/SC-8."}
  - {rule: MGMT-TELNET-01, vendor: cisco_ios_xe, controls: [CISC-ND-000470], source: authored, covers: part,
     note: "One of the insecure services the STIG rule covers."}
  - {rule: MGMT-TELNET-01, vendor: cisco_ios_xe, controls: [CISC-ND-001210], source: authored, covers: part,
     note: "Telnet carries management sessions unencrypted, which the STIG forbids; the SSH ciphers aren't checked.",
     bridge_note: "DISA files remote-management encryption under MA-4(6) (nonlocal maintenance); the rule anchors the same protection as AC-17(2)/SC-8."}
  - {rule: MGMT-VTY-ACL-01, vendor: cisco_ios_xe, controls: [CISC-ND-000140], source: authored, covers: part,
     note: "Checks each vty line has an access-class, not which addresses it admits.",
     bridge_note: "DISA files management-access ACLs under AC-4 (information flow); the rule anchors them as access enforcement (AC-3, AC-17)."}
  - {rule: MGMT-VTY-ACL-02, vendor: cisco_ios_xe, controls: [CISC-ND-000140], source: authored, covers: part,
     note: "Checks the access-class exists and doesn't admit everyone.",
     bridge_note: "DISA files management-access ACLs under AC-4 (information flow); the rule anchors them as access enforcement (AC-3, AC-17)."}
  - {rule: MGMT-WEB-ACL-01, vendor: cisco_ios_xe, controls: [CISC-ND-000140], source: authored, covers: part,
     note: "Checks the web server has an access-class, not which addresses it admits.",
     bridge_note: "DISA files management-access ACLs under AC-4 (information flow); the rule anchors them as access enforcement (AC-3, AC-17)."}
  - {rule: SNMP-COMMUNITY-01, vendor: cisco_ios_xe, controls: [CISC-ND-001130], source: authored, covers: part,
     note: "The STIG asks for SNMPv3 with HMAC; a well-known or writable community fails it, but a private v2c community doesn't pass it.",
     bridge_note: "DISA files SNMP authentication under IA-3(1) (device authentication); the rule anchors community strings as authenticators (IA-5)."}
  - {rule: SVC-LEGACY-01, vendor: cisco_ios_xe, controls: [CISC-ND-000470], source: authored, covers: part,
     note: "The legacy services the rule knows are among those the STIG rule covers."}
  - {rule: SVC-PROXY-ARP-01, vendor: cisco_ios_xe, controls: [CISC-RT-000380], source: authored, covers: stricter,
     note: "The STIG asks only external interfaces; the rule asks every interface."}
  - {rule: TIME-NTP-AUTH-01, vendor: cisco_ios_xe, controls: [CISC-ND-001150], source: authored}

