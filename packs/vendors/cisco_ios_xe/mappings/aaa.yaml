# AAA: local accounts and their password storage, TACACS+/RADIUS servers, lockout, password
# policy. The secret itself is matched by an unnamed <STR> slot: it is never captured into a
# fact, and evidence lines are masked (`secret 9 ****`).
#
# Cisco password types: 0 = clear text, 4 = unsalted SHA-256 (deprecated as broken),
# 5 = MD5-crypt, 6 = AES (reversible), 7 = Vigenère (reversible), 8 = PBKDF2-SHA-256,
# 9 = scrypt. A type not listed here makes hash_type
# *unknown*, which a rule reports as REVIEW rather than guessing.
mappings:
  # `enable` is modelled as the local account it effectively is (privilege 15), so the
  # password-storage rule covers it like any user.
  - id: cisco_ios_xe/enable-secret
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: enable}
    match: "enable secret <INT:type> <STR>"
    effect:
      - {assert: LocalUser.privilege, value: 15}
      - {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "4": cisco-type-4, "5": md5-crypt, "8": pbkdf2-sha256, "9": scrypt}}
    negation: null
    provenance: {version: 2, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/enable-password
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: enable}
    match: "enable password <INT:type> <STR>"
    effect:
      - {assert: LocalUser.privilege, value: 15}
      - {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/username-privilege-secret
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: "{name}"}
    match: "username <STR:name> privilege <INT:priv> secret <INT:type> <STR>"
    effect:
      - {set: LocalUser.privilege, from: priv}
      - {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "4": cisco-type-4, "5": md5-crypt, "8": pbkdf2-sha256, "9": scrypt}}
    negation: null
    provenance: {version: 2, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/username-privilege-password
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: "{name}"}
    match: "username <STR:name> privilege <INT:priv> password <INT:type> <STR>"
    effect:
      - {set: LocalUser.privilege, from: priv}
      - {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "6": cisco-type-6-aes, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/username-secret
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: "{name}"}
    match: "username <STR:name> secret <INT:type> <STR>"
    effect: {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "4": cisco-type-4, "5": md5-crypt, "8": pbkdf2-sha256, "9": scrypt}}
    negation: null
    provenance: {version: 2, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/username-password
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: "{name}"}
    match: "username <STR:name> password <INT:type> <STR>"
    effect: {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "6": cisco-type-6-aes, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # --- Central authentication servers ----------------------------------------------------------
  - id: cisco_ios_xe/tacacs-server
    vendor: cisco_ios_xe
    entity: {type: AuthServer, key: "tacacs:{name}"}
    match: "tacacs server <STR:name>"
    effect: {assert: AuthServer.kind, value: tacacs}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/tacacs-server-address
    vendor: cisco_ios_xe
    context: ["tacacs server <STR:name>"]
    entity: {type: AuthServer, key: "tacacs:{name}"}
    match: "address ipv4 <IP:host>"
    effect: {set: AuthServer.host, from: host}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/tacacs-server-key-typed
    vendor: cisco_ios_xe
    context: ["tacacs server <STR:name>"]
    entity: {type: AuthServer, key: "tacacs:{name}"}
    match: "key <INT> <STR>"
    effect: {assert: AuthServer.key_present, value: true}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/tacacs-server-key
    vendor: cisco_ios_xe
    context: ["tacacs server <STR:name>"]
    entity: {type: AuthServer, key: "tacacs:{name}"}
    match: "key <STR>"
    effect: {assert: AuthServer.key_present, value: true}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/tacacs-server-host-legacy
    vendor: cisco_ios_xe
    entity: {type: AuthServer, key: "tacacs:{host}"}
    match: "tacacs-server host <IP:host>"
    effect:
      - {assert: AuthServer.kind, value: tacacs}
      - {set: AuthServer.host, from: host}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/tacacs-server-host-legacy-key
    vendor: cisco_ios_xe
    entity: {type: AuthServer, key: "tacacs:{host}"}
    match: "tacacs-server host <IP:host> key <INT> <STR>"
    effect:
      - {assert: AuthServer.kind, value: tacacs}
      - {set: AuthServer.host, from: host}
      - {assert: AuthServer.key_present, value: true}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/radius-server
    vendor: cisco_ios_xe
    entity: {type: AuthServer, key: "radius:{name}"}
    match: "radius server <STR:name>"
    effect: {assert: AuthServer.kind, value: radius}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/radius-server-address
    vendor: cisco_ios_xe
    context: ["radius server <STR:name>"]
    entity: {type: AuthServer, key: "radius:{name}"}
    match: "address ipv4 <IP:host>"
    effect: {set: AuthServer.host, from: host}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/radius-server-address-ports
    vendor: cisco_ios_xe
    context: ["radius server <STR:name>"]
    entity: {type: AuthServer, key: "radius:{name}"}
    match: "address ipv4 <IP:host> auth-port <INT> acct-port <INT>"
    effect: {set: AuthServer.host, from: host}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/radius-server-key-typed
    vendor: cisco_ios_xe
    context: ["radius server <STR:name>"]
    entity: {type: AuthServer, key: "radius:{name}"}
    match: "key <INT> <STR>"
    effect: {assert: AuthServer.key_present, value: true}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/radius-server-key
    vendor: cisco_ios_xe
    context: ["radius server <STR:name>"]
    entity: {type: AuthServer, key: "radius:{name}"}
    match: "key <STR>"
    effect: {assert: AuthServer.key_present, value: true}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # --- Lockout and password policy -------------------------------------------------------------
  # login block-for <seconds> attempts <tries> within <seconds>: after <tries> failures within
  # the window, all logins are refused for <seconds> (login quiet mode).
  - id: cisco_ios_xe/login-block-for
    vendor: cisco_ios_xe
    match: "login block-for <INT:block> attempts <INT:tries> within <INT:window>"
    effect:
      - {set: LockoutPolicy.lockout_s, from: block}
      - {set: LockoutPolicy.max_attempts, from: tries}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/security-passwords-min-length
    vendor: cisco_ios_xe
    match: "security passwords min-length <INT:n>"
    effect: {set: PasswordPolicy.min_length, from: n}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # --- Line passwords: a shared secret on the line itself (`line vty 0 4` / ` password 7 …`).
  # Modelled as a LocalUser named after the line, so the password-storage rule judges it too.
  - id: cisco_ios_xe/vty-range-password
    vendor: cisco_ios_xe
    context: ["line vty <INT:first> <INT:last>"]
    entity: {type: LocalUser, key: "line vty {first}-{last}"}
    match: "password <INT:type> <STR>"
    effect: {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/vty-single-password
    vendor: cisco_ios_xe
    context: ["line vty <INT:n>"]
    entity: {type: LocalUser, key: "line vty {n}"}
    match: "password <INT:type> <STR>"
    effect: {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/con-password
    vendor: cisco_ios_xe
    context: ["line con <INT:n>"]
    entity: {type: LocalUser, key: "line con {n}"}
    match: "password <INT:type> <STR>"
    effect: {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # --- Which methods administrator logins use ---------------------------------------------------
  # `aaa authentication login default <methods>` decides how every line without its own list
  # authenticates. A named server group (`aaa group server tacacs+ TACACS-GRP`) counts as the
  # kind of server it holds, so `group TACACS-GRP` means `tacacs`. A TACACS+ server that no
  # method list names is not central authentication (aaa.central_login_in_use).

  - id: cisco_ios_xe/server-group-tacacs
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "server_group:{g}"}
    match: "aaa group server tacacs+ <STR:g>"
    effect: [{assert: ObjectDef.kind, value: server_group}, {assert: ObjectDef.members, value: [tacacs]}]
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/server-group-radius
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "server_group:{g}"}
    match: "aaa group server radius <STR:g>"
    effect: [{assert: ObjectDef.kind, value: server_group}, {assert: ObjectDef.members, value: [radius]}]
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/server-group-ldap
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "server_group:{g}"}
    match: "aaa group server ldap <STR:g>"
    effect: [{assert: ObjectDef.kind, value: server_group}, {assert: ObjectDef.members, value: [ldap]}]
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-default-group-tacacs
    vendor: cisco_ios_xe
    match: "aaa authentication login default group tacacs+ [<LIST>]"
    effect: {assert: AuthPolicy.login_methods, value: [tacacs]}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-default-group-radius
    vendor: cisco_ios_xe
    match: "aaa authentication login default group radius [<LIST>]"
    effect: {assert: AuthPolicy.login_methods, value: [radius]}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-default-group-ldap
    vendor: cisco_ios_xe
    match: "aaa authentication login default group ldap [<LIST>]"
    effect: {assert: AuthPolicy.login_methods, value: [ldap]}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-default-group-named
    vendor: cisco_ios_xe
    match: "aaa authentication login default group <STR:g> [<LIST>]"
    effect: {ref: AuthPolicy.login_methods, from: g, target: server_group, expand: true}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-default-first-method
    vendor: cisco_ios_xe
    match: "aaa authentication login default <STR:m> [<LIST>]"
    effect: {set: AuthPolicy.login_methods, template: "{m}", map: {local-case: local}}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}


  # Named method lists (`aaa authentication login VTY-LOGIN group TACACS-GRP local`) are read
  # like the default list, into an object a line can name. The first method is what logins are
  # checked against; later ones are fallbacks. A server group counts as the kind it holds.

  - id: cisco_ios_xe/login-list-group-tacacs
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "login_list:{n}"}
    match: "aaa authentication login <STR:n> group tacacs+ [<LIST>]"
    effect: [{assert: ObjectDef.kind, value: login_list}, {assert: ObjectDef.members, value: [tacacs]}]
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-list-group-radius
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "login_list:{n}"}
    match: "aaa authentication login <STR:n> group radius [<LIST>]"
    effect: [{assert: ObjectDef.kind, value: login_list}, {assert: ObjectDef.members, value: [radius]}]
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-list-group-ldap
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "login_list:{n}"}
    match: "aaa authentication login <STR:n> group ldap [<LIST>]"
    effect: [{assert: ObjectDef.kind, value: login_list}, {assert: ObjectDef.members, value: [ldap]}]
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-list-group-named
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "login_list:{n}"}
    match: "aaa authentication login <STR:n> group <STR:g> [<LIST>]"
    effect:
      - {assert: ObjectDef.kind, value: login_list}
      - {ref: ObjectDef.members, from: g, target: server_group, expand: true}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/login-list-first-method
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "login_list:{n}"}
    match: "aaa authentication login <STR:n> <STR:m> [<LIST>]"
    effect:
      - {assert: ObjectDef.kind, value: login_list}
      - {set: ObjectDef.members, template: "{m}", map: {local-case: local}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}


  # `login authentication <list>` on a vty line: the line's logins are checked against that
  # list (`default` is the device default, read above). Remote logins are then judged by what
  # every vty line's list has in common (resolver). Console lines may keep a local list for
  # break-glass access, so they don't take part.

  - id: cisco_ios_xe/vty-range-login-authentication
    vendor: cisco_ios_xe
    context: ["line vty <INT:first> <INT:last>"]
    entity: {type: MgmtSession, key: "vty {first}-{last}"}
    match: "login authentication <STR:list>"
    effect:
      - {set: MgmtSession.auth_method, from: list}
      - {ref: MgmtSession.login_methods, from: list, target: login_list, expand: true, unless: [default]}
    negation: null
    provenance: {version: 2, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/vty-single-login-authentication
    vendor: cisco_ios_xe
    context: ["line vty <INT:n>"]
    entity: {type: MgmtSession, key: "vty {n}"}
    match: "login authentication <STR:list>"
    effect:
      - {set: MgmtSession.auth_method, from: list}
      - {ref: MgmtSession.login_methods, from: list, target: login_list, expand: true, unless: [default]}
    negation: null
    provenance: {version: 2, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/con-login-authentication
    vendor: cisco_ios_xe
    context: ["line con <INT:n>"]
    entity: {type: MgmtSession, key: "con {n}"}
    match: "login authentication <STR:n>"
    effect: {set: MgmtSession.auth_method, from: n}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}
