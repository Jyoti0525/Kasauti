# AAA: local accounts and their password storage, TACACS+/RADIUS servers, lockout, password
# policy. The secret itself is matched by an unnamed <STR> slot: it is never captured into a
# fact, and evidence lines are masked (`secret 9 ****`).
#
# Cisco password types: 0 = clear text, 5 = MD5-crypt, 6 = AES (reversible), 7 = Vigenère
# (reversible), 8 = PBKDF2-SHA-256, 9 = scrypt. A type not listed here makes hash_type
# *unknown*, which a rule reports as REVIEW rather than guessing.
mappings:
  # `enable` is modelled as the local account it effectively is (privilege 15), so the
  # password-storage rule covers it like any user.
  - id: cisco_ios_xe/enable-secret
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: enable}
    match: "enable secret <INT:type> <STR>"
    effect:
      - {assert: LocalUser.privilege, value: 15}
      - {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "5": md5-crypt, "8": pbkdf2-sha256, "9": scrypt}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/enable-password
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: enable}
    match: "enable password <INT:type> <STR>"
    effect:
      - {assert: LocalUser.privilege, value: 15}
      - {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/username-privilege-secret
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: "{name}"}
    match: "username <STR:name> privilege <INT:priv> secret <INT:type> <STR>"
    effect:
      - {set: LocalUser.privilege, from: priv}
      - {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "5": md5-crypt, "8": pbkdf2-sha256, "9": scrypt}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/username-privilege-password
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: "{name}"}
    match: "username <STR:name> privilege <INT:priv> password <INT:type> <STR>"
    effect:
      - {set: LocalUser.privilege, from: priv}
      - {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "6": cisco-type-6-aes, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/username-secret
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: "{name}"}
    match: "username <STR:name> secret <INT:type> <STR>"
    effect: {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "5": md5-crypt, "8": pbkdf2-sha256, "9": scrypt}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/username-password
    vendor: cisco_ios_xe
    entity: {type: LocalUser, key: "{name}"}
    match: "username <STR:name> password <INT:type> <STR>"
    effect: {set: LocalUser.hash_type, from: type, map: {"0": plaintext, "6": cisco-type-6-aes, "7": cisco-type-7}}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # --- Central authentication servers ----------------------------------------------------------
  - id: cisco_ios_xe/tacacs-server
    vendor: cisco_ios_xe
    entity: {type: AuthServer, key: "tacacs:{name}"}
    match: "tacacs server <STR:name>"
    effect: {assert: AuthServer.kind, value: tacacs}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/tacacs-server-address
    vendor: cisco_ios_xe
    context: ["tacacs server <STR:name>"]
    entity: {type: AuthServer, key: "tacacs:{name}"}
    match: "address ipv4 <IP:host>"
    effect: {set: AuthServer.host, from: host}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/tacacs-server-key-typed
    vendor: cisco_ios_xe
    context: ["tacacs server <STR:name>"]
    entity: {type: AuthServer, key: "tacacs:{name}"}
