  # --- Lockout and password policy -------------------------------------------------------------
  # login block-for <seconds> attempts <tries> within <seconds>: after <tries> failures within
  # the window, all logins are refused for <seconds> (login quiet mode).
  - id: cisco_ios_xe/login-block-for
    vendor: cisco_ios_xe
    match: "login block-for <INT:block> attempts <INT:tries> within <INT:window>"
    effect:
      - {set: LockoutPolicy.lockout_s, from: block}
      - {set: LockoutPolicy.max_attempts, from: tries}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/security-passwords-min-length
    vendor: cisco_ios_xe
    match: "security passwords min-length <INT:n>"
    effect: {set: PasswordPolicy.min_length, from: n}
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}
