    effect:
      - {assert: FilterRule.src, value: [any]}
      - {members: FilterRule.dst, from: d}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/acl-ext-ip-any-net
    vendor: cisco_ios_xe
    context: ["ip access-list extended <STR:acl>"]
    entity: {type: FilterRule, key: "{acl}:{seq}"}
    match: "<INT:seq> <STR:action> ip any <IP:dn> <IP:dw> [log]"
    effect:
      - {assert: FilterRule.src, value: [any]}
      - {members: FilterRule.dst, template: "{dn} {dw}"}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/acl-ext-ip-host-any
