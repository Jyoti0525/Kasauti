# ACL entries as FilterRule entities, keyed <acl>:<sequence> (PLAN §8.1, §13).
#
# Every entry becomes a FilterRule with its position, ruleset and action. Source, destination
# and protocol are read for the address forms below; an entry in any other form (object
# groups, port operators on `ip`) keeps those facts *absent*, so a rule asking "does anything
# permit all traffic?" answers REVIEW for it rather than guessing. Addresses are recorded as
# written: "any", "<host ip>", or "<network> <wildcard>".
#
# Full ruleset semantics (object expansion, shadowing, redundancy) are the policy analyser's
# job (TODO M4.13-M4.22); these mappings give it and the M2 rules the entries to work on.
mappings:
  # --- Named extended ACLs ------------------------------------------------------------------
  - id: cisco_ios_xe/acl-ext-entry
    vendor: cisco_ios_xe
    context: ["ip access-list extended <STR:acl>"]
    entity: {type: FilterRule, key: "{acl}:{seq}"}
    match: "<INT:seq> <STR:action> <STR:proto> <LIST>"
    effect:
      - {set: FilterRule.ruleset, from: acl}
      - {set: FilterRule.position, from: seq}
      - {set: FilterRule.action, from: action, map: {permit: permit, deny: deny}}
      - {members: FilterRule.service, from: proto}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/acl-ext-ip-any-any
    vendor: cisco_ios_xe
    context: ["ip access-list extended <STR:acl>"]
    entity: {type: FilterRule, key: "{acl}:{seq}"}
    match: "<INT:seq> <STR:action> ip any any [log]"
    effect:
      - {assert: FilterRule.src, value: [any]}
      - {assert: FilterRule.dst, value: [any]}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/acl-ext-ip-any-host
    vendor: cisco_ios_xe
    context: ["ip access-list extended <STR:acl>"]
    entity: {type: FilterRule, key: "{acl}:{seq}"}
