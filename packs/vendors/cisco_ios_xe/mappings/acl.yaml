# ACL entries as FilterRule entities, keyed <acl>:<sequence> (PLAN §8.1, §13).
#
# Every entry becomes a FilterRule with its position, ruleset and action. Source, destination
# and protocol are read for the address forms below; an entry in any other form (object
# groups, port operators on `ip`) keeps those facts *absent*, so a rule asking "does anything
# permit all traffic?" answers REVIEW for it rather than guessing. Addresses are recorded as
# written: "any", "<host ip>", or "<network> <wildcard>".
#
# Full ruleset semantics (object expansion, shadowing, redundancy) are the policy analyser's
# job (TODO M4.13-M4.22); these mappings give it and the M2 rules the entries to work on.
mappings:
  # --- The ACLs themselves (targets of access-class / access-group references) --------------
  - id: cisco_ios_xe/acl-extended
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "acl:{acl}"}
    match: "ip access-list extended <STR:acl>"
    effect: {assert: ObjectDef.kind, value: acl}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/acl-standard
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "acl:{acl}"}
    match: "ip access-list standard <STR:acl>"
    effect: {assert: ObjectDef.kind, value: acl}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/acl-numbered
    vendor: cisco_ios_xe
    entity: {type: ObjectDef, key: "acl:{acl}"}
    match: "access-list <INT:acl> <LIST>"
    effect: {assert: ObjectDef.kind, value: acl}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # Remarks are comments: understood, and they neither permit nor deny anything.
  - id: cisco_ios_xe/acl-remark
    vendor: cisco_ios_xe
    context: ["ip access-list <STR:kind> <STR:acl>"]
    entity: {type: ObjectDef, key: "acl:{acl}"}
    match: "remark [<LIST>]"
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # --- Named extended ACLs ------------------------------------------------------------------
  - id: cisco_ios_xe/acl-ext-entry
    vendor: cisco_ios_xe
    context: ["ip access-list extended <STR:acl>"]
    entity: {type: FilterRule, key: "{acl}:{seq}"}
    match: "<INT:seq> <STR:action> <STR:proto> <LIST>"
    effect:
      - {set: FilterRule.ruleset, from: acl}
      - {set: FilterRule.position, from: seq}
      - {set: FilterRule.action, from: action, map: {permit: permit, deny: deny}}
      - {members: FilterRule.service, from: proto}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # Source of an entry for any protocol (destination and ports follow in <LIST>).
  - id: cisco_ios_xe/acl-ext-src-any
    vendor: cisco_ios_xe
    context: ["ip access-list extended <STR:acl>"]
    entity: {type: FilterRule, key: "{acl}:{seq}"}
    match: "<INT:seq> <STR:action> <STR:proto> any <LIST>"
    effect: {assert: FilterRule.src, value: [any]}
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  # Source of an entry for any protocol (destination and ports follow in <LIST>).
  # One protocol (`permit tcp any host 203.0.113.2 eq 22`): source and destination are read,
  # the ports after them aren't, so the entry covers some of that protocol's traffic.
  - id: cisco_ios_xe/acl-ext-proto-any-any
    vendor: cisco_ios_xe
    context: ["ip access-list extended <STR:acl>"]
    entity: {type: FilterRule, key: "{acl}:{seq}"}
    match: "<INT:seq> <STR:action> <STR:proto> any any [<LIST>]"
    effect: [{assert: FilterRule.src, value: [any]}, {assert: FilterRule.dst, value: [any]}]
    negation: null
    provenance: {version: 1, proposed_by: "seed:kasauti", approved_by: [maintainer], signals: [manual]}

  - id: cisco_ios_xe/acl-ext-proto-any-host
