# Where each identity field appears (PLAN §7). A running-config has hostname and the release
# train (`version 17.9`); serial, model and the exact release come from companion outputs
# (show version / show inventory, TODO M2.05). Sources are tried in order.
fields:
  hostname:
    - {source: config, pattern: "hostname <STR:value>"}
  os_version:
    - {source: config, pattern: "version <STR:value>"}
    - {source: show_version, pattern: "Cisco IOS XE Software, Version <STR:value>"}
  model:
    - {source: show_inventory, pattern: "PID: <STR:value> , VID: <STR> , SN: <STR>"}
  serial:
    - {source: show_inventory, pattern: "PID: <STR> , VID: <STR> , SN: <STR:value>"}
    - {source: show_version, pattern: "Processor board ID <STR:value>"}
  hardware:
    - {source: show_version, pattern: "cisco <STR:value> <LIST>"}
