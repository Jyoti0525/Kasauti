format_version: 1
id: paloalto_panos
name: Palo Alto Networks PAN-OS
vendor: Palo Alto Networks
os_family: PAN-OS
shape_family: xml
pack_version: 1
# A PAN-OS running configuration is one XML document; the XML shape parser renders every leaf
# as "<element> <value>" under the path of its ancestors (`entry NAME` for named entries). There
# is no negated form: a setting the file doesn't hold is read from defaults.yaml.
negation_words: []
time_unit: minutes
default_role: firewall
# Seed pack (PLAN §20.4, TODO M2.30), reviewed in docs/reviews/paloalto_panos.md. The
# description below is shown to users (knowledge base screen), so it carries no plan references.
description: >
  Palo Alto Networks firewall running configurations (`running-config.xml`,
  `show config running` as XML). Management is reached through the MGT port (its service
  switches and permitted IPs) or through interface management profiles; security rules match
  zones, addresses, applications and services. Reviewed against Palo Alto Networks'
  documentation.
