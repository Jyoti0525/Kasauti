# Management plane: idle timeout, MGT port services and permitted IPs, profile services, banner.
# Seed mappings: reviewed in docs/reviews/paloalto_panos.md.
mappings:
- id: paloalto_panos/idle-timeout
  vendor: paloalto_panos
  context:
  - setting
  - management
  entity:
    type: MgmtSession
    key: admin
  match: idle-timeout <INT:m>
  effect:
  - assert: MgmtSession.kind
    value: cli
  - set: MgmtSession.idle_timeout_s
    from: m
    transform:
    - unit: minutes
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: paloalto_panos/mgt-telnet
  vendor: paloalto_panos
  context:
  - deviceconfig
  - system
  - service
  entity:
    type: MgmtService
    key: telnet
  match: disable-telnet <STR:v>
  effect:
    set: MgmtService.enabled
    from: v
    map:
      'yes': false
      'no': true
    combine: any
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
