- id: arista_eos/acl-ext-entry
  vendor: arista_eos
  context:
  - ip access-list <STR:acl>
  entity:
    type: FilterRule
    key: '{acl}:{seq}'
  match: <INT:seq> <STR:action> <STR:proto> <LIST>
  effect:
  - set: FilterRule.ruleset
    from: acl
  - set: FilterRule.position
    from: seq
  - set: FilterRule.action
    from: action
    map:
      permit: permit
      deny: deny
  - members: FilterRule.service
    from: proto
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
