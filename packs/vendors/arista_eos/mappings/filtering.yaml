# Interfaces, ACLs (addresses in prefix notation, e.g. 10.0.0.0/8), references.
# Seed mappings: reviewed in docs/reviews/arista_eos.md.
mappings:
- id: arista_eos/interface
  vendor: arista_eos
  entity:
    type: Interface
    key: '{n}'
  match: interface <IFNAME:n>
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: arista_eos/interface-description
  vendor: arista_eos
  context:
  - interface <IFNAME:n>
  entity:
    type: Interface
    key: '{n}'
  match: description <LIST:t>
  effect:
    set: Interface.description
    template: '{t}'
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: arista_eos/interface-shutdown
  vendor: arista_eos
  context:
  - interface <IFNAME:n>
  entity:
    type: Interface
    key: '{n}'
  match: shutdown
  effect:
    assert: Interface.admin_up
    value: false
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: arista_eos/interface-proxy-arp
  vendor: arista_eos
  context:
  - interface <IFNAME:n>
  entity:
    type: Interface
    key: '{n}'
  match: ip proxy-arp
  effect:
    assert: Interface.proxy_arp
    value: true
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: arista_eos/interface-access-group-in
  vendor: arista_eos
  context:
  - interface <IFNAME:n>
  entity:
    type: Interface
    key: '{n}'
  match: ip access-group <STR:acl> in
  effect:
