    set: LocalUser.hash_type
    from: h
    transform:
    - prefix:
        PB2: pbkdf2-sha256
        SH2: sha256
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
