# Interfaces (management access, role), proxy ARP, firewall policies, address objects.
# Seed mappings: reviewed in docs/reviews/fortinet_fortios.md.
mappings:
- id: fortinet_fortios/interface
  vendor: fortinet_fortios
  context:
  - config system interface
  entity:
    type: Interface
    key: '{i}'
  match: edit <STR:i>
  effect:
    set: Interface.zone
    template: '{i}'
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
