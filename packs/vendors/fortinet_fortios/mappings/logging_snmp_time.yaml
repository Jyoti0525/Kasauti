- id: fortinet_fortios/snmp-community-name
  vendor: fortinet_fortios
  context:
  - config system snmp community
  - edit <INT:id>
  entity:
    type: SnmpCommunity
    key: community-{id}
  match: set name <STR:c>
  effect:
    set: SnmpCommunity.is_well_known
    from: c
    map:
      public: true
      private: true
      cisco: true
      community: true
      admin: true
      default: true
      secret: true
      manager: true
      monitor: true
      snmp: true
      snmpd: true
      read: true
      write: true
      all: true
      security: true
      test: true
      password: true
      fortinet: true
      fortigate: true
    otherwise: false
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
