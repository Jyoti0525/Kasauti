# Remote syslog, event logging, SNMP communities, NTP (sync switch, FortiGuard or custom servers).
# Seed mappings: reviewed in docs/reviews/fortinet_fortios.md.
mappings:
- id: fortinet_fortios/syslogd-status
  vendor: fortinet_fortios
  context:
  - config log syslogd setting
  entity:
    type: LogTarget
    key: syslogd
  match: set status <STR:s>
  effect:
    set: LogTarget.enabled
    from: s
    map:
      enable: true
      disable: false
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: fortinet_fortios/syslogd-server
  vendor: fortinet_fortios
  context:
  - config log syslogd setting
  entity:
    type: LogTarget
    key: syslogd
  match: set server <STR:h>
  effect:
    set: LogTarget.host
    from: h
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: fortinet_fortios/syslogd-mode
  vendor: fortinet_fortios
  context:
  - config log syslogd setting
  entity:
    type: LogTarget
    key: syslogd
  match: set mode <STR:p>
  effect:
    set: LogTarget.transport
    from: p
    map:
      udp: udp
      reliable: tcp
      legacy-reliable: tcp
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: fortinet_fortios/syslogd-tls
  vendor: fortinet_fortios
  context:
  - config log syslogd setting
  entity:
    type: LogTarget
    key: syslogd
  match: set enc-algorithm <STR:e>
  effect:
    set: LogTarget.transport
    from: e
    map:
      high-medium: tls
      high: tls
      low: tls
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
