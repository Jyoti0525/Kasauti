# What FortiOS does when the configuration says nothing (PLAN §8.2, §9.4). FortiGate backups
# print only non-default settings, so these carry much of the weight. Vendor defaults quote the
# "Default" column of Fortinet's FortiOS 7.4 CLI reference, read 2026-09-26
# (docs/reviews/fortinet_fortios.md).
# Not stated in the pages checked, so no entry (the rule says REVIEW): whether FortiGuard's NTP
# servers are authenticated (see ntp-server-unauthenticated). What the pack doesn't read yet is
# listed in the review record.
defaults:
  # --- management plane ----------------------------------------------------------------------
  - id: admin-session-kind
    attr: MgmtSession.kind
    entity_key: admin
    value: cli
    source: curated
    reference: >-
      Model default: FortiOS has one administrator idle timeout (`admintimeout`) for GUI and CLI
      sessions, modelled as one session of kind `cli`.

  - id: admintimeout-5-minutes
    attr: MgmtSession.idle_timeout_s
    entity_key: admin
    value: 300
    source: vendor_doc
    reference: >-
      config system global, admintimeout: "Number of minutes before an idle administrator
      session times out." Default 5 (range 1-480, so it can't be switched off).
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: telnet-only-where-allowed
    attr: MgmtService.enabled
    entity_key: telnet
    value: false
    source: curated
    reference: >-
      Model default: `admin-telnet` (default enable) only permits the service; FortiOS answers
      Telnet only on interfaces whose `allowaccess` lists telnet, and those are read into
      Interface.mgmt_protocols (judged by management.telnet_reachable).

  - id: http-redirected-to-https
    attr: MgmtService.enabled
    entity_key: http
    value: false
    source: vendor_doc
    reference: >-
      config system global, admin-https-redirect: "Enable/disable redirection of HTTP
      administration access to HTTPS." Default enable, so HTTP administration isn't served in
      clear text unless the redirect is disabled.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: ssh-available
    attr: MgmtService.enabled
    entity_key: ssh
    value: true
    source: curated
    reference: >-
      Model default: FortiOS has no global SSH switch; SSH administration is offered on every
      interface whose `allowaccess` lists ssh. Assumed on, so the SSH version is always judged.

  - id: https-available
    attr: MgmtService.enabled
    entity_key: https
    value: true
    source: curated
    reference: >-
      Model default: like SSH, the HTTPS administration server has no global switch; it is
      offered on every interface whose `allowaccess` lists https. Assumed on, so who may reach
      it (trusted hosts) is always judged.

  - id: ssh-v1-off
    attr: MgmtService.version
    entity_key: ssh
    value: "2"
    source: vendor_doc
    reference: >-
      config system global, admin-ssh-v1: "Enable/disable SSH v1 compatibility." Default disable.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: pre-login-banner-off
    attr: Banner.present
    entity_key: login
    value: false
    source: vendor_doc
    reference: >-
      config system global, pre-login-banner: "Enable/disable displaying the administrator
      access disclaimer message on the login page before an administrator logs in." Default
      disable.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: no-interface-mgmt-access
    attr: Interface.mgmt_protocols
    value: []
    source: vendor_doc
    reference: >-
      config system interface, allowaccess: "Permitted types of management access to this
      interface." No default value: nothing is allowed unless listed.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/317104469/config-system-interface

  - id: proxy-arp-off
    attr: Interface.proxy_arp
    value: false
    source: curated
    reference: >-
      Model default: FortiOS answers ARP for other addresses only for the ranges listed in
      `config system proxy-arp`, which the mappings read.

  - id: no-legacy-pad
    attr: MgmtService.enabled
    entity_key: pad
    value: false
    source: curated
    reference: "Model default: FortiOS has no X.25 PAD service."

  - id: no-legacy-finger
    attr: MgmtService.enabled
    entity_key: finger
    value: false
    source: curated
    reference: "Model default: FortiOS has no finger service."

  - id: no-legacy-bootp
    attr: MgmtService.enabled
    entity_key: bootp
    value: false
    source: curated
    reference: "Model default: FortiOS runs no BOOTP server; its DHCP server is configured per interface."

  - id: no-tcp-small-servers
    attr: MgmtService.enabled
    entity_key: tcp-small-servers
    value: false
    source: curated
    reference: "Model default: FortiOS has no TCP small servers."

  - id: no-udp-small-servers
    attr: MgmtService.enabled
    entity_key: udp-small-servers
    value: false
    source: curated
    reference: "Model default: FortiOS has no UDP small servers."

  # --- AAA -----------------------------------------------------------------------------------
  - id: lockout-after-3
    attr: LockoutPolicy.max_attempts
    value: 3
    source: vendor_doc
    reference: >-
      config system global, admin-lockout-threshold: "Number of failed login attempts before an
      administrator account is locked out for the admin-lockout-duration." Default 3.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: lockout-60-seconds
    attr: LockoutPolicy.lockout_s
    value: 60
    source: vendor_doc
    reference: >-
      config system global, admin-lockout-duration: "Amount of time in seconds that an
      administrator account is locked out". Default 60.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: password-policy-off
    attr: PasswordPolicy.enforced
    value: false
    source: vendor_doc
    reference: >-
      config system password-policy, status: "Enable/disable setting a password policy for
      locally defined administrator passwords and IPsec VPN pre-shared keys." Default disable.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/127236326/config-system-password-policy

  - id: password-minimum-8
    attr: PasswordPolicy.min_length
    value: 8
    source: vendor_doc
    reference: >-
      config system password-policy, minimum-length: "Minimum password length." Default 8
      (range 8-128).
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/127236326/config-system-password-policy

  - id: passwords-stored-encoded
    attr: PasswordPolicy.cleartext_passwords_encrypted
    value: true
    source: vendor_doc
    reference: >-
      Enhanced administrator password security: administrator passwords are stored hashed and
      shown encoded (`set password ENC SH2…` or `ENC PB2…`), never in clear text.
      https://docs.fortinet.com/document/fortigate/7.4.8/administration-guide/548023/enhanced-administrator-password-security-new

  - id: admin-trusted-hosts-any-ipv4
    attr: LocalUser.permitted_sources
    value: [any]
    source: vendor_doc
    reference: >-
      config system admin, trusthost1-10: "Any IPv4 address or subnet address and netmask from
      which the administrator can connect to the FortiGate unit. Default allows access from any
      IPv4 address." Default 0.0.0.0 0.0.0.0.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/390485493/config-system-admin

  - id: admin-trusted-hosts-any-ipv6
    attr: LocalUser.permitted_sources_v6
    value: [any]
    source: vendor_doc
    reference: >-
      config system admin, ip6-trusthost1-10: "Any IPv6 address from which the administrator can
      connect to the FortiGate unit. Default allows access from any IPv6 address." Default ::/0,
      kept apart from the IPv4 list, so restricting only IPv4 leaves IPv6 open.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/390485493/config-system-admin

  - id: no-auth-servers
    none_of: AuthServer
    source: curated
    reference: >-
      Model default: every TACACS+, RADIUS and LDAP server appears under `config user tacacs+`,
      `config user radius` or `config user ldap`; none there means none exist.

  # --- logging, SNMP, time -------------------------------------------------------------------
  - id: syslog-off
    attr: LogTarget.enabled
    value: false
    source: vendor_doc
    reference: >-
      config log syslogd setting, status: "Enable/disable remote syslog logging." Default
      disable.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/141516630/config-log-syslogd-setting

  - id: syslog-udp
    attr: LogTarget.transport
    value: udp
    source: vendor_doc
    reference: >-
      config log syslogd setting, mode: "Remote syslog logging over UDP/Reliable TCP." Default
      udp.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/141516630/config-log-syslogd-setting

  - id: config-changes-logged
    attr: LoggingPolicy.config_change_logged
    value: true
    source: vendor_doc
    reference: >-
      config log eventfilter: `event` ("Enable/disable event logging") and `system`
      ("Enable/disable system event logging") both default enable; a configuration change is
      system event 44546/44547 "Attribute configured" with `user`, `cfgpath` and `cfgattr`.
      https://docs.fortinet.com/document/fortigate/7.4.2/cli-reference/437620/config-log-eventfilter
      https://docs.fortinet.com/document/fortigate/7.4.4/fortios-log-message-reference/44547/44547-logid-event-config-objattr

  - id: logs-timestamped
    attr: LoggingPolicy.timestamps
    value: true
    source: vendor_doc
    reference: >-
      FortiOS Log Message Reference: every log message carries `date`, `time`, `eventtime` and
      `tz` fields.
      https://docs.fortinet.com/document/fortigate/7.4.4/fortios-log-message-reference/44547/44547-logid-event-config-objattr

  - id: no-snmp-communities
    none_of: SnmpCommunity
    source: curated
    reference: >-
      Model default: every SNMP community appears under `config system snmp community`; none
      there means none exist.

  - id: snmp-read-only
    attr: SnmpCommunity.access
    value: ro
    source: vendor_doc
    reference: >-
      FortiOS SNMP: "The FortiGate SNMP implementation is read-only"; SNMP v1/v2c/v3 managers
      have read-only access.
      https://docs.fortinet.com/document/fortigate/7.4.3/administration-guide/62595/snmp

  - id: ntp-sync-off
    attr: TimePolicy.sync_enabled
    value: false
    source: vendor_doc
    reference: >-
      config system ntp, ntpsync: "Enable/disable setting the FortiGate system time by
      synchronizing with an NTP Server." Default disable.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/105110478/config-system-ntp

  - id: ntp-fortiguard-servers
    attr: TimeSource.enabled
    entity_key: fortiguard
    value: true
    source: vendor_doc
    reference: >-
      config system ntp, type: "Use the FortiGuard NTP server or any other available NTP
      Server." Default fortiguard; `set type custom` switches to the `ntpserver` list.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/105110478/config-system-ntp

  - id: ntp-server-unauthenticated
    attr: TimeSource.authenticated
    except_keys: [fortiguard]
    value: false
    source: vendor_doc
    reference: >-
      config system ntp, ntpserver, authentication: "Enable/disable authentication." Default
      disable. Not applied to the FortiGuard servers: Fortinet's NTP authentication pages
      configure keys only for `type custom` servers and say nothing about FortiGuard's, so
      whether they are authenticated is not stated (TimePolicy.auth_enforced still applies).
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/105110478/config-system-ntp
      https://docs.fortinet.com/document/fortigate/7.4.0/administration-guide/336196/cryptographic-hash-function-authentication-support

  - id: ntp-authentication-off
    attr: TimePolicy.auth_enforced
    value: false
    source: vendor_doc
    reference: >-
      config system ntp, authentication: "Enable/disable authentication." Default disable.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/105110478/config-system-ntp

  # --- filtering -----------------------------------------------------------------------------
  - id: policy-action-deny
    attr: FilterRule.action
    value: deny
    source: vendor_doc
    reference: >-
      config firewall policy, action: "Policy action (accept/deny/ipsec)." Default deny. It
      holds for local-in policies too: config firewall local-in-policy, action: "Action
      performed on traffic matching the policy." Default deny; the Local-in policy guide: "When
      you define a local-in policy, if no action is set manually, then the action will default
      to deny."
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/333889629/config-firewall-policy
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/185227842/config-firewall-local-in-policy

  - id: no-filter-rules
    none_of: FilterRule
    source: curated
    reference: >-
      Model default: every firewall policy appears under `config firewall policy`; with none,
      FortiOS denies all traffic through the unit ("If the parameters do not match any
      configured policies, the traffic is denied").

  # --- Management ports (so a local-in policy naming a service can be matched) ---------------
  - id: https-port-443
    attr: MgmtService.port
    entity_key: https
    value: 443
    source: vendor_doc
    reference: >-
      config system global, admin-sport: "Administrative access port for HTTPS." Default 443.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: ssh-port-22
    attr: MgmtService.port
    entity_key: ssh
    value: 22
    source: vendor_doc
    reference: >-
      config system global, admin-ssh-port: "Administrative access port for SSH." Default 22.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: http-port-80
    attr: MgmtService.port
    entity_key: http
    value: 80
    source: vendor_doc
    reference: >-
      config system global, admin-port: "Administrative access port for HTTP." Default 80.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: telnet-port-23
    attr: MgmtService.port
    entity_key: telnet
    value: 23
    source: vendor_doc
    reference: >-
      config system global, admin-telnet-port: "Administrative access port for TELNET." Default 23.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/339914554/config-system-global

  - id: no-interface-mgmt-access-ipv6
    attr: Interface.mgmt_protocols_v6
    value: []
    source: vendor_doc
    reference: >-
      config system interface, config ipv6, ip6-allowaccess: "Allow management access to the
      interface." No default value: nothing is allowed over IPv6 unless listed.
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/317104469/config-system-interface

  # --- Local-in policies and firewall policies as a whole (kasauti/policy/firstmatch.py) -----
  - id: local-in-guards-the-device
    attr: Ruleset.applies_to
    entity_key: local-in
    value: device
    source: vendor_doc
    reference: >-
      Local-in policy: "local-in policies control inbound traffic that is going to a FortiGate
      interface." "Local-in policies can be used to restrict administrative access".
      https://docs.fortinet.com/document/fortigate/7.6.4/administration-guide/363127/local-in-policy

  - id: local-in-ipv4
    attr: Ruleset.family
    entity_key: local-in
    value: ipv4
    source: vendor_doc
    reference: >-
      config firewall local-in-policy: "Configure user defined IPv4 local-in policies."
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/185227842/config-firewall-local-in-policy

  - id: local-in-no-implicit-deny
    attr: Ruleset.unmatched
    entity_key: local-in
    value: permit
    source: vendor_doc
    reference: >-
      Local-in policy, Implicit deny rule: "Unlike IPv4 policies, there is no default implicit
      deny policy. The implicit deny policy should be placed at the bottom of the list of
      local-in-policies." Traffic no local-in policy matches is left to the interface's
      `allowaccess` and the administrators' trusted hosts.
      https://docs.fortinet.com/document/fortigate/7.6.4/administration-guide/363127/local-in-policy

  - id: local-in-empty-permits
    attr: Ruleset.when_empty
    entity_key: local-in
    value: permit
    source: vendor_doc
    reference: >-
      Same sentence: with no local-in policies there is nothing that denies.
      https://docs.fortinet.com/document/fortigate/7.6.4/administration-guide/363127/local-in-policy

  - id: local-in-config-order
    attr: Ruleset.order
    entity_key: local-in
    value: config
    source: vendor_doc
    reference: >-
      Fortinet Community technical tip, How to move the order local-in policy: policies are
      reordered with `move <id> before <id>`, and "the way the policies are read by the
      FortiGate goes from top to bottom. Meaning that everything moved to the top ... will have
      precedence over the other policies." The policy ID is not the order.
      https://community.fortinet.com/t5/FortiGate/Technical-Tip-How-to-move-the-order-local-in-policy-FortiGate/ta-p/300597

  - id: local-in6-guards-the-device
    attr: Ruleset.applies_to
    entity_key: local-in6
    value: device
    source: vendor_doc
    reference: >-
      Local-in policy: "local-in policies control inbound traffic that is going to a FortiGate
      interface"; IPv6 ones are configured under `config firewall local-in-policy6`.
      https://docs.fortinet.com/document/fortigate/7.6.4/administration-guide/363127/local-in-policy

  - id: local-in6-ipv6
    attr: Ruleset.family
    entity_key: local-in6
    value: ipv6
    source: vendor_doc
    reference: >-
      config firewall local-in-policy6: "Configure user defined IPv6 local-in policies."
      https://docs.fortinet.com/document/fortigate/7.4.4/cli-reference/871912328/config-firewall-local-in-policy6

  - id: local-in6-no-implicit-deny
    attr: Ruleset.unmatched
    entity_key: local-in6
    value: permit
    source: vendor_doc
    reference: >-
      The Local-in policy page covers `config firewall {local-in-policy | local-in-policy6}`:
      "Unlike IPv4 policies, there is no default implicit deny policy."
      https://docs.fortinet.com/document/fortigate/7.6.4/administration-guide/363127/local-in-policy

  - id: local-in6-empty-permits
    attr: Ruleset.when_empty
    entity_key: local-in6
    value: permit
    source: vendor_doc
    reference: >-
      Same sentence: with no IPv6 local-in policies there is nothing that denies.
      https://docs.fortinet.com/document/fortigate/7.6.4/administration-guide/363127/local-in-policy

  - id: local-in6-config-order
    attr: Ruleset.order
    entity_key: local-in6
    value: config
    source: vendor_doc
    reference: >-
      As for IPv4 local-in policies: read "from top to bottom", reordered with `move`.
      https://community.fortinet.com/t5/FortiGate/Technical-Tip-How-to-move-the-order-local-in-policy-FortiGate/ta-p/300597

  - id: policy-implicit-deny
    attr: Ruleset.unmatched
    entity_key: policy
    value: deny
    source: vendor_doc
    reference: >-
      Fortinet Community technical tip, How policy order works on FortiGate: "If there is no
      matching policy among the policies that have been configured for traffic, the packet
      finally falls to what is always the last policy. It is an implicit policy. ... The default
      action for the implicit policy is to deny every traffic."
      https://community.fortinet.com/t5/FortiGate/Technical-Tip-How-policy-order-works-on-FortiGate/ta-p/207381

  - id: policy-config-order
    attr: Ruleset.order
    entity_key: policy
    value: config
    source: vendor_doc
    reference: >-
      Same tip: "The policies are checked from top to bottom. The first rule that matches is
      applied, and subsequent rules are not evaluated." Policies are reordered in the list, so
      the policy ID is not the order.
      https://community.fortinet.com/t5/FortiGate/Technical-Tip-How-policy-order-works-on-FortiGate/ta-p/207381
