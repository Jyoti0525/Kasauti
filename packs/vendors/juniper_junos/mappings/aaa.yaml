    value: tacacs
  - set: AuthServer.host
    from: h
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: juniper_junos/tacplus-server-inline-secret
  vendor: juniper_junos
  context:
  - system
  - tacplus-server
  entity:
    type: AuthServer
    key: tacacs:{h}
  match: <IP:h> secret <STR>
  effect:
    assert: AuthServer.key_present
    value: true
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: juniper_junos/tacplus-server-secret
  vendor: juniper_junos
  context:
  - system
  - tacplus-server
  - <IP:h>
  entity:
    type: AuthServer
