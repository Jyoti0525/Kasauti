  effect:
    assert: Interface.admin_up
    value: false
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: juniper_junos/unit-proxy-arp
  vendor: juniper_junos
