- id: juniper_junos/zone-host-inbound-service
  vendor: juniper_junos
  context:
  - security
  - zones
  - security-zone <STR:z>
  - interfaces
  - <STR:i>
  - host-inbound-traffic
  - system-services
  entity:
    type: Interface
    key: '{i}'
  match: <STR:svc> [except]
  effect:
    members: Interface.mgmt_protocols
    from: svc
    map:
      ping: icmp
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: juniper_junos/zone-host-inbound-any
  vendor: juniper_junos
  context:
  - security
  - zones
  - security-zone <STR:z>
  - interfaces
  - <STR:i>
  - host-inbound-traffic
  - system-services
  entity:
    type: Interface
    key: '{i}'
  match: any-service
  effect:
    assert: Interface.mgmt_protocols
    value:
    - ssh
    - telnet
    - http
    - https
    - snmp
    - ftp
    - icmp
    - netconf
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
