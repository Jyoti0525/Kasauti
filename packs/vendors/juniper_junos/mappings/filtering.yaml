    key: '{i}.{u}'
  match: proxy-arp [<STR>]
  effect:
    assert: Interface.proxy_arp
    value: true
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
