# Ports narrow a term to part of its protocol's traffic (never all of it); logging and
# counting in `then { }` don't change what the term matches.
- id: juniper_junos/term-destination-port
  vendor: juniper_junos
  context:
  - filter <STR:f>
  - term <STR:t>
  - from
  entity:
    type: FilterRule
    key: '{f}:{t}'
  match: destination-port <LIST>
  effect:
    assert: FilterRule.narrowed
    value: true
    combine: any
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
