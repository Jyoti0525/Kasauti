# Interfaces (modelled at the logical unit, where Junos applies addresses, filters
# and zones), security zones, firewall filters and SRX security policies.
# Seed mappings: reviewed in docs/reviews/juniper_junos.md.
mappings:
- id: juniper_junos/interface-unit
  vendor: juniper_junos
  context:
  - interfaces
  - <IFNAME:i>
  entity:
    type: Interface
    key: '{i}.{u}'
  match: unit <INT:u>
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: juniper_junos/unit-description
  vendor: juniper_junos
  context:
  - interfaces
  - <IFNAME:i>
  - unit <INT:u>
  entity:
    type: Interface
    key: '{i}.{u}'
  match: description <STR:d>
  effect:
    set: Interface.description
    from: d
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: juniper_junos/unit-disable
  vendor: juniper_junos
  context:
  - interfaces
  - <IFNAME:i>
  - unit <INT:u>
  entity:
    type: Interface
    key: '{i}.{u}'
