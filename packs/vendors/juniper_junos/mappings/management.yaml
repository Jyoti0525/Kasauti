# Management plane: services, SSH, login classes (sessions), banners.
# Seed mappings: reviewed in docs/reviews/juniper_junos.md.
mappings:
- id: juniper_junos/service-telnet
  vendor: juniper_junos
  context:
  - system
  - services
  entity:
    type: MgmtService
    key: telnet
  match: telnet
  effect:
    assert: MgmtService.enabled
    value: true
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
