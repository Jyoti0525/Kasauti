- id: juniper_junos/login-class
  vendor: juniper_junos
  context:
  - system
  - login
  entity:
    type: MgmtSession
    key: class:{c}
  match: class <STR:c>
  effect:
    assert: MgmtSession.kind
    value: cli
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: juniper_junos/login-class-idle-timeout
  vendor: juniper_junos
  context:
  - system
  - login
  - class <STR:c>
  entity:
    type: MgmtSession
    key: class:{c}
  match: idle-timeout <INT:m>
  effect:
    set: MgmtSession.idle_timeout_s
    from: m
    transform:
    - unit: minutes
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
