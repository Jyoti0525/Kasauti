# Fingerprint for Junos configurations (PLAN §7): curly-brace, or the same configuration as
# `set` commands (`show configuration | display set`, TODO M2.28). Each signature matches the
# statement in either form, so both score alike.
min_score: 0.7
signatures:
  - {id: version-statement, kind: regex, pattern: '^(set )?version \d+\.\d+[RXDSI]', weight: 0.3}
  - {id: system-block, kind: regex, pattern: '^(\s*system \{|set system )', weight: 0.2}
  - {id: host-name, kind: regex, pattern: '^(\s+host-name \S+;|set system host-name \S+)', weight: 0.2}
  - {id: junos-interface, kind: regex, pattern: '^(\s+(ge|xe|et|ae|fe|xle|mge)-\d+/\d+/\d+ \{|set interfaces (ge|xe|et|ae|fe|xle|mge)-\d+/\d+/\d+ )', weight: 0.2}
  - {id: root-authentication, kind: regex, pattern: '(root-authentication \{|^set system root-authentication )', weight: 0.2}
  - {id: security-zones, kind: contains, pattern: "security-zone ", weight: 0.1}
