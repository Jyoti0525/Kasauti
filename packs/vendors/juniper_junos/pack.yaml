format_version: 1
id: juniper_junos
name: Juniper Junos OS
vendor: Juniper
os_family: Junos OS
shape_family: brace
pack_version: 1
negation_words: []     # brace form has no negation: deactivated (inactive:) config is dropped by the parser
comment_markers: ["#", "/*"]
time_unit: minutes
default_role: router
# A `show configuration | display set` export is read as the brace configuration it stands for:
# each line split where this pack's mappings expect blocks (TODO M2.28; docs/reviews/juniper_junos.md).
set_form:
  # Statements whose value is an ordered list; `display set` may give one value per line.
  leaf_lists: [authentication-order, protocol-version]
# Seed pack (PLAN §20.4, TODO M2.28), reviewed in docs/reviews/juniper_junos.md. The
# description below is shown to users (knowledge base screen), so it carries no plan references.
description: >
  Junos OS hierarchical (curly-brace) configurations: MX, EX and QFX routers and switches and
  SRX firewalls. Interfaces are modelled at the logical unit (`ge-0/0/0.0`), where Junos
  applies addresses, filters and security zones. Reviewed against Juniper's documentation.
