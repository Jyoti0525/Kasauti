# Network ACLs (describe-network-acls): numbered allow and deny entries, inbound and
# outbound, IPv4 and IPv6 evaluated separately.
# - Every entry is in force (enabled: true): NetworkAclEntry has no field that turns one
#   off.
# - The entry's header opens it; its record gives the ruleset (direction, IP version). An
#   entry whose record matches no pattern has no ruleset and counts, unknown, in every one.
# Seed mappings: reviewed in docs/reviews/aws_vpc.md.
mappings:
- id: aws_vpc/network-acl
  vendor: aws_vpc
  entity:
    type: ObjectDef
    key: network_acl:{a}
  match: NetworkAcls <STR:a>
  effect:
    assert: ObjectDef.kind
    value: network_acl
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: aws_vpc/network-acl-record
  vendor: aws_vpc
  context:
  - NetworkAcls <STR:a>
  entity:
    type: ObjectDef
    key: network_acl:{a}
  match: '@ [IsDefault <STR:d>] NetworkAclId <STR:id> OwnerId <STR:o> VpcId <STR:v>'
  effect:
    assert: ObjectDef.kind
    value: network_acl
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
