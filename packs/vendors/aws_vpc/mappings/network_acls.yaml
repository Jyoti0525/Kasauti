- id: aws_vpc/nacl-entry
  vendor: aws_vpc
  context:
  - NetworkAcls <STR:a>
  entity:
    type: FilterRule
    key: '{a}:{i}'
  match: Entries <INT:i>
  effect:
    assert: FilterRule.enabled
    value: true
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: aws_vpc/nacl-ingress-ipv4
  vendor: aws_vpc
  context:
  - NetworkAcls <STR:a>
  - Entries <INT:i>
  entity:
    type: FilterRule
    key: '{a}:{i}'
  match: '@ CidrBlock <IP:c> Egress false [IcmpTypeCode.Code <STR:ic> IcmpTypeCode.Type <STR:it>] [PortRange.From
    <STR:f> PortRange.To <STR:t>] Protocol <STR:p> RuleAction <STR:act> RuleNumber <INT:n>'
  effect:
  - set: FilterRule.ruleset
    template: nacl:{a}:ingress:ipv4
  - set: FilterRule.position
    from: n
  - set: FilterRule.action
    from: act
    map:
      allow: permit
      deny: deny
  - members: FilterRule.src
    from: c
    transform:
    - network
    map:
      0.0.0.0/0: any
  - assert: FilterRule.dst
    value:
    - any
  - members: FilterRule.service
    template: ip-proto-{p}
    map:
      ip-proto--1: ip
      ip-proto-6: tcp
      ip-proto-17: udp
      ip-proto-1: icmp
      ip-proto-58: icmp6
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
