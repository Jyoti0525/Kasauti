- id: aws_vpc/sg-ingress
  vendor: aws_vpc
  context:
  - SecurityGroups <STR:g>
  entity:
    type: FilterRule
    key: '{g}:ingress:{i}'
  match: IpPermissions <INT:i>
  effect:
  - set: FilterRule.ruleset
    template: sg:{g}:ingress
  - assert: FilterRule.action
    value: permit
  - assert: FilterRule.dst
    value:
    - any
  - assert: FilterRule.enabled
    value: true
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: aws_vpc/sg-ingress-protocol
  vendor: aws_vpc
  context:
  - SecurityGroups <STR:g>
  - IpPermissions <INT:i>
  entity:
    type: FilterRule
    key: '{g}:ingress:{i}'
  match: '@ [FromPort <STR:f>] IpProtocol <STR:p> [ToPort <STR:t>]'
  effect:
    members: FilterRule.service
    template: ip-proto-{p}
    map:
      ip-proto--1: ip
      ip-proto-tcp: tcp
      ip-proto-6: tcp
      ip-proto-udp: udp
      ip-proto-17: udp
      ip-proto-icmp: icmp
      ip-proto-1: icmp
      ip-proto-icmpv6: icmp6
      ip-proto-58: icmp6
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
