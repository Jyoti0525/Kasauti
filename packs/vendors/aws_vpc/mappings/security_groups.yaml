# Security groups (describe-security-groups): each rule of IpPermissions (inbound) and
# IpPermissionsEgress (outbound) is one permit entry; its sources or destinations are
# address ranges, prefix lists and other security groups.
# - Every rule is in force (enabled: true): IpPermission has no field that turns one off.
# - A group pair with UserId names a group that exists (AWS drops the account once the
#   group is deleted); one without it is a stale rule, and its reference dangles.
# - A record with a field these patterns don't name matches none of them: REVIEW.
# Seed mappings: reviewed in docs/reviews/aws_vpc.md.
mappings:
- id: aws_vpc/security-group
  vendor: aws_vpc
  entity:
    type: ObjectDef
    key: security_group:{g}
  match: SecurityGroups <STR:g>
  effect:
    assert: ObjectDef.kind
    value: security_group
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
- id: aws_vpc/security-group-record
  vendor: aws_vpc
  context:
  - SecurityGroups <STR:g>
  entity:
    type: ObjectDef
    key: security_group:{g}
  match: '@ [Description <STR:d>] GroupId <STR:id> GroupName <STR:n> OwnerId <STR:o> [SecurityGroupArn
    <STR:arn>] [VpcId <STR:v>]'
  effect:
    assert: ObjectDef.kind
    value: security_group
  negation: null
  provenance:
    version: 1
    proposed_by: seed:kasauti
    approved_by:
    - maintainer
    signals:
    - manual
