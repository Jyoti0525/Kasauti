format_version: 1
id: aws_vpc
name: Amazon VPC security groups and network ACLs
vendor: Amazon Web Services
os_family: Amazon VPC
shape_family: json_yaml
pack_version: 1
# The AWS CLI prints what the EC2 API returns, as JSON (the default) or YAML. Each rule is one
# object whose fields belong together (IpProtocol, FromPort, ToPort), so list items are read as
# records: one statement per item, its fields in key order (kasauti/shape/structured.py). There
# is no negated form: a rule the export doesn't hold isn't there.
negation_words: []
default_role: cloud_filter
records:
  names:
    SecurityGroups: GroupId
    NetworkAcls: NetworkAclId
  # `aws ec2 describe-security-groups` and `aws ec2 describe-network-acls`, their outputs
  # merged into one object (docs/reviews/aws_vpc.md). A file with only one of them is partial.
  sections: [SecurityGroups, NetworkAcls]
# Seed pack (PLAN §20.4, TODO M2.31), reviewed in docs/reviews/aws_vpc.md. The description
# below is shown to users (knowledge base screen), so it carries no plan references.
description: >
  A VPC's security groups and network ACLs, as the AWS CLI prints them
  (`describe-security-groups`, `describe-network-acls`). Security groups hold allow rules only;
  network ACL entries are numbered, allow or deny, and evaluated lowest number first. Reviewed
  against the Amazon VPC User Guide and the EC2 API Reference.
