# Access restrictions a configuration implies but doesn't state as a filter (PLAN §12.7).
# Inferences only fill absent facts; an ACL the admin named always wins.
# Vendor-neutral: they read SBM facts, so every vendor pack benefits.

inferences:
  # --- Sources restricted per account --------------------------------------------------------
  # FortiOS restricts administrator logins per account (trusted hosts), not per service: an
  # account with no trusted host accepts logins from anywhere, over every management protocol
  # the interface allows. Only when *every* account is restricted do the device's management
  # services refuse other sources, as an access filter would. Platforms without per-account
  # sources (Cisco, Junos, EOS) have no `permitted_sources`, so this never fires there.
  - id: mgmt_service.access_filter.per_account_sources
    version: 1
    description: >
      Where every administrator account may log in only from listed sources, IPv4 and IPv6,
      the management services accept logins only from those sources.
    for_each: MgmtService where key in [ssh, http, https]
    when: >
      all(LocalUser: exists(permitted_sources) and not permitted_sources contains 'any'
          and (not exists(permitted_sources_v6) or not permitted_sources_v6 contains 'any'))
    set: {access_filter: per-account-sources}

  # --- Sources restricted per service --------------------------------------------------------
  # PAN-OS lists the addresses the MGT port accepts (`permitted-ip`; empty, the default, means
  # any address), and each interface management profile has its own list (empty: "no IP
  # address restrictions"), which the interfaces using the profile inherit. A service is
  # restricted only if the MGT port's list is, and so is every interface that offers the
  # service. The expression language has no way to name the outer service inside `all(...)`,
  # so there is one inference per service.
  - id: mgmt_service.access_filter.permitted_sources.ssh
    version: 1
    description: >
      SSH management that accepts connections only from listed sources, on the
      management port and on every interface offering it, is restricted as an access filter
      would restrict it.
    for_each: MgmtService where key == 'ssh'
    when: >
      exists(permitted_sources) and not permitted_sources contains 'any'
      and all(Interface: not exists(mgmt_protocols) or not mgmt_protocols contains 'ssh'
              or (exists(mgmt_permitted_sources) and not mgmt_permitted_sources contains 'any'))
    set: {access_filter: permitted-sources}

  - id: mgmt_service.access_filter.permitted_sources.http
    version: 1
    description: >
      HTTP management that accepts connections only from listed sources, on the
      management port and on every interface offering it, is restricted as an access filter
      would restrict it.
    for_each: MgmtService where key == 'http'
    when: >
      exists(permitted_sources) and not permitted_sources contains 'any'
      and all(Interface: not exists(mgmt_protocols) or not mgmt_protocols contains 'http'
              or (exists(mgmt_permitted_sources) and not mgmt_permitted_sources contains 'any'))
    set: {access_filter: permitted-sources}

  - id: mgmt_service.access_filter.permitted_sources.https
    version: 1
    description: >
      HTTPS management that accepts connections only from listed sources, on the
      management port and on every interface offering it, is restricted as an access filter
      would restrict it.
    for_each: MgmtService where key == 'https'
    when: >
      exists(permitted_sources) and not permitted_sources contains 'any'
      and all(Interface: not exists(mgmt_protocols) or not mgmt_protocols contains 'https'
              or (exists(mgmt_permitted_sources) and not mgmt_permitted_sources contains 'any'))
    set: {access_filter: permitted-sources}
