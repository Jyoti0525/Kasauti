# Device-level meanings for AAA, logging and SNMP (PLAN §8.3).

derivations:
  # Replaces aaa.central_server_configured (v1), which asked only whether a server existed:
  # a TACACS+ server that no login uses passed, a false PASS on FortiOS and PAN-OS.
  - id: aaa.central_login_in_use
    version: 1
    type: bool
    description: >
      Administrator logins are checked against a TACACS+, RADIUS or LDAP server that is
      configured with an address. A server that no login method uses doesn't count. (A vty
      line naming a method list other than `default` makes the login methods unknown: the
      Cisco mappings don't resolve named lists yet.)
    expr: >
      ((any(AuthPolicy: login_methods contains 'tacacs')
        and any(AuthServer: kind == 'tacacs' and exists(host)))
       or (any(AuthPolicy: login_methods contains 'radius')
        and any(AuthServer: kind == 'radius' and exists(host)))
       or (any(AuthPolicy: login_methods contains 'ldap')
        and any(AuthServer: kind == 'ldap' and exists(host))))

  - id: logging.remote_configured
    version: 2
    type: bool
    description: >
      At least one remote log target (syslog host) is configured and switched on. Where a
      platform has no separate switch (no `enabled` fact), naming the host is what turns it on.
    expr: "any(LogTarget: exists(host) and (not exists(enabled) or enabled))"

  - id: snmp.weak_community_present
    version: 1
    type: bool
    description: >
      An SNMP community is a well-known string (public, private, …) or grants write access.
      With no communities at all this is false only if the vendor pack says none exist by
      default (`none_of: SnmpCommunity`); otherwise it is absent and the rule decides.
    expr: "any(SnmpCommunity: is_well_known or access == 'rw')"
