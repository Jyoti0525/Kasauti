version 23.4R1.9;
system {
    host-name COV-1;
    root-authentication {
        encrypted-password "$6$PLACEHOLDER$HASH";
    }
    login {
        announcement "Authorised use only";
        message "Authorised access only.";
        class OPS {
            idle-timeout 5;
        }
        class NOC;
        user alice {
            class OPS;
            authentication {
                encrypted-password "$6$PLACEHOLDER$HASH";
            }
        }
        user bob {
            class NOC;
        }
        password {
            minimum-length 12;
        }
        retry-options {
            tries-before-disconnect 4;
            lockout-period 15;
        }
    }
    authentication-order [ radius tacplus password ];
    radius-server {
        10.0.0.5 {
            secret "$9$PLACEHOLDER";
            port 1812;
        }
        10.0.0.6 secret "$9$PLACEHOLDER";
    }
    tacplus-server {
        10.0.0.7 {
            secret "$9$PLACEHOLDER";
        }
    }
    services {
        telnet;
        finger;
        ftp;
        ssh {
            protocol-version [ v1 v2 ];
        }
        web-management {
            https {
                system-generated-certificate;
            }
            http;
        }
    }
    syslog {
        host 10.0.0.8 {
            change-log any;
            interactive-commands any;
        }
        host 10.0.0.9;
        file changes {
            change-log any;
            interactive-commands any;
        }
    }
    ntp {
        server 10.0.0.10 prefer version 4;
        server 10.0.0.11 key 2;
        trusted-key [ 1 2 ];
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            description "uplink";
            family inet {
                address 192.0.2.2/30;
                proxy-arp restricted;
                filter {
                    input EDGE;
                    output EDGE;
                }
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            disable;
            family ethernet-switching {
                interface-mode access;
            }
        }
        unit 1 {
            family ethernet-switching {
                port-mode trunk;
            }
        }
    }
    inactive: ge-0/0/2 {
        unit 0 {
            family inet {
                address 198.51.100.1/24;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 192.0.2.1;
        route 10.0.0.0/8 discard;
        route 10.1.0.0/16 reject;
        route 10.2.0.0/16 {
            next-hop 192.0.2.9;
        }
        route 10.3.0.0/16;
        route 10.4.0.0/16 next-hop st0.0;
        route 10.5.0.0/16 {
            next-hop [ 192.0.2.9 st0.0 ];
            qualified-next-hop 192.0.2.10 {
                preference 7;
            }
            qualified-next-hop ge-0/0/1.0;
        }
        route 10.6.0.0/16 qualified-next-hop 192.0.2.11;
        route 10.7.0.0/16 qualified-next-hop ge-0/0/1.0;
    }
}
snmp {
    community public {
        authorization read-write;
    }
    community ops-ro-2026 {
        authorization read-only;
    }
    community private;
}
firewall {
    filter EDGE {
        term BLOCK-TELNET {
            from {
                destination-address {
                    0.0.0.0/0;
                    10.0.0.0/8 except;
                }
                protocol tcp;
                destination-port [ telnet 23 ];
            }
            then {
                count telnet-hits;
                log;
                reject;
            }
        }
        term SRC {
            from {
                source-address {
                    192.0.2.0/24;
                }
                source-port 1024-65535;
            }
            then discard;
        }
        term REST {
            then accept;
        }
    }
    family inet {
        filter OTHER {
            term T1 {
                then {
                    accept;
                }
            }
        }
    }
}
security {
    zones {
        security-zone trust {
            host-inbound-traffic {
                system-services {
                    all;
                    telnet except;
                }
            }
            interfaces {
                ge-0/0/0.0 {
                    host-inbound-traffic {
                        system-services {
                            any-service;
                        }
                    }
                }
                ge-0/0/1.0;
            }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy ALLOW-WEB {
                match {
                    source-address any;
                    destination-address any;
                    application junos-https;
                }
                then {
                    permit;
                }
            }
            policy DENY-REST {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                }
            }
            inactive: policy OLD {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
}
